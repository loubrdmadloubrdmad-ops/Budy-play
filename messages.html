<!DOCTYPE html>
<html lang="fr">

<style>
  :root { --bg:#0b0b0c; --card:#161718; --line:#26282a; --neon:#39ff14; --text:#fff; --muted:#9a9ea3; --err:#ff5a5a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; line-height:1.4; }
  header { padding:16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  header a { color:var(--text); text-decoration:none; font-size:1.4rem; font-weight:800; }
  header a span { color:var(--neon); }
  header a.s { font-size:.95rem; font-weight:600; color:var(--muted); }
  main { max-width:520px; margin:0 auto; padding:16px 16px 40px; }
  h1 { font-size:1.5rem; margin-bottom:12px; }
  h2 { font-size:1.05rem; margin-bottom:10px; color:var(--neon); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tabs button { flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:1rem; position:relative; }
  .tabs button.on { border-color:var(--neon); color:var(--neon); }
  .dot { background:var(--neon); color:#000; border-radius:99px; font-size:.75rem; font-weight:800; padding:1px 7px; margin-left:6px; }
  input, select { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0b0b0c; color:var(--text); font-size:1rem; }
  input:focus, select:focus { outline:none; border-color:var(--neon); }
  .btn { padding:10px 14px; border:0; border-radius:10px; background:var(--neon); color:#000; font-weight:700; font-size:.95rem; }
  .btn.sec { background:transparent; border:1px solid var(--line); color:var(--text); }
  .btn.no { background:transparent; border:1px solid var(--err); color:var(--err); }
  .btn:disabled { opacity:.5; }
  .line { display:flex; gap:8px; align-items:center; }
  .item { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); cursor:default; }
  .item:last-child { border-bottom:0; }
  .item.click { cursor:pointer; }
  .who { font-weight:700; }
  .sub { color:var(--muted); font-size:.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:230px; }
  .tag { color:var(--neon); font-size:.8rem; }
  #info { min-height:1.2em; margin:6px 0 12px; font-size:.95rem; }
  .err { color:var(--err); } .ok { color:var(--neon); }
  .empty { color:var(--muted); padding:6px 0; }
  .hidden { display:none; }
  .btn, .tabs button { display:inline-flex; align-items:center; justify-content:center; }
  #chat { display:flex; flex-direction:column; height:calc(100vh - 150px); min-height:320px; }
  #chat-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  #chat-name { font-weight:800; }
  #bubbles { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:8px 2px; }
