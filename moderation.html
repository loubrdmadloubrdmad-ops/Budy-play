<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modération - Budy Play</title>
<style>
  :root { --bg:#0b0b0c; --card:#161718; --line:#26282a; --neon:#39ff14; --text:#fff; --muted:#9a9ea3; --err:#ff5a5a; --warn:#ffb020; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; line-height:1.4; }
  header { padding:16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  header a { color:var(--text); text-decoration:none; font-size:1.4rem; font-weight:800; }
  header a span { color:var(--neon); }
  header a.s { font-size:.95rem; font-weight:600; color:var(--muted); }
  main { max-width:560px; margin:0 auto; padding:16px 16px 120px; }
  h1 { font-size:1.5rem; margin-bottom:6px; }
  .lead { color:var(--muted); font-size:.9rem; margin-bottom:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px; }
  .tabs button { padding:9px 2px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:.8rem; display:inline-flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:2px; }
  .tabs button.on { border-color:var(--neon); color:var(--neon); }
  .dot { background:var(--neon); color:#000; border-radius:99px; font-size:.7rem; font-weight:800; padding:0 6px; margin-left:3px; }
  input, select { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0b0b0c; color:var(--text); font-size:1rem; }
  input:focus, select:focus { outline:none; border-color:var(--neon); }
  label { display:block; color:var(--muted); font-size:.85rem; margin:10px 0 4px; }
  .btn { padding:9px 12px; border:0; border-radius:10px; background:var(--neon); color:#000; font-weight:700; font-size:.88rem; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
  .btn.sec { background:transparent; border:1px solid var(--line); color:var(--text); }
  .btn.no { background:transparent; border:1px solid var(--err); color:var(--err); }
  .btn.warn { background:transparent; border:1px solid var(--warn); color:var(--warn); }
  .btn:disabled { opacity:.5; }
  .hidden { display:none !important; }
  .line { display:flex; gap:8px; align-items:center; }
  .wrap { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .who { font-weight:800; overflow-wrap:anywhere; }
  .meta { color:var(--muted); font-size:.82rem; margin-top:2px; overflow-wrap:anywhere; }
  .pill { display:inline-block; font-size:.7rem; font-weight:700; border:1px solid var(--line); border-radius:20px; padding:1px 8px; margin-right:4px; color:var(--muted); }
  .pill.g { color:var(--neon); border-color:var(--neon); }
  .pill.r { color:var(--err); border-color:var(--err); }
  .pill.w { color:var(--warn); border-color:var(--warn); }
  .quote { margin-top:8px; padding:8px 10px; border-left:3px solid var(--err); background:#0f1011; border-radius:6px; color:var(--text); overflow-wrap:anywhere; white-space:pre-wrap; font-size:.92rem; }
  .empty { color:var(--muted); padding:6px 0; }
  #info { min-height:1.2em; margin:4px 0 10px; font-size:.95rem; }
  .err { color:var(--err); } .ok { color:var(--neon); }
  .row { padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:60; background:#101112; border-top:2px solid var(--neon); padding:14px 16px calc(14px + env(safe-area-inset-bottom)); max-height:80vh; overflow-y:auto; }
  #sheet .in { max-width:560px; margin:0 auto; }
  #sheet h2 { font-size:1.05rem; margin-bottom:4px; color:var(--neon); overflow-wrap:anywhere; }
  #a-msg { min-height:1.2em; margin-top:8px; font-size:.9rem; }
</style>
</head>
<body>
<header><a href="index.html">Budy <span>Play</span></a><a class="s" href="compte.html" data-i="user">Compte</a></header>
<main>
  <div id="guest" class="hidden card">
    <h1 data-i="shield">Modération</h1>
    <p>Connecte-toi avec un compte de l'équipe pour ouvrir cette page.</p>
    <p style="margin-top:12px"><a class="btn" href="compte.html" data-i="login">Se connecter</a></p>
  </div>
  <div id="nope" class="hidden card">
    <h1 data-i="shield">Modération</h1>
    <p>Cette page est réservée au fondateur et aux modérateurs.</p>
    <p style="margin-top:12px"><a class="btn" href="index.html" data-i="home">Accueil</a></p>
  </div>

  <div id="app" class="hidden">
    <h1 data-i="shield">Modération</h1>
    <p class="lead" id="lead"></p>
    <div class="tabs">
      <button id="t-rep" class="on" type="button">Signalements<span id="b-rep"></span></button>
      <button id="t-san" type="button">Sanctions</button>
      <button id="t-his" type="button">Historique</button>
      <button id="t-mem" type="button">Membre</button>
    </div>
    <p id="info"></p>

    <div id="p-rep">
      <div class="line" style="margin-bottom:10px">
        <button class="btn" id="f-open" type="button">À traiter</button>
        <button class="btn sec" id="f-closed" type="button">Classés</button>
      </div>
      <div id="reports"></div>
    </div>

    <div id="p-san" class="hidden">
      <div class="line" style="margin-bottom:10px">
        <button class="btn" id="s-act" type="button">En cours</button>
        <button class="btn sec" id="s-all" type="button">Toutes</button>
      </div>
      <div id="sanctions"></div>
    </div>

    <div id="p-his" class="hidden"><div class="card" id="history"></div></div>

    <div id="p-mem" class="hidden">
      <div class="card">
        <label for="mid" style="margin-top:0">Trouver un membre par Budy ID</label>
        <div class="line">
          <input id="mid" inputmode="numeric" placeholder="ex : 100021">
          <button class="btn" id="find" type="button" data-i="user">Chercher</button>
        </div>
      </div>
      <div id="found"></div>
    </div>
  </div>
</main>

<div id="sheet" class="hidden">
  <div class="in">
    <h2 id="a-title">Sanction</h2>
    <p class="meta" id="a-sub"></p>
    <label for="a-kind">Sanction</label>
    <select id="a-kind"></select>
    <label for="a-reason">Raison (le membre la verra, 3 à 300 caractères)</label>
    <input id="a-reason" maxlength="300" autocomplete="off">
    <div class="line" style="margin-top:12px">
      <button class="btn" id="a-ok" type="button" data-i="check">Confirmer</button>
      <button class="btn sec" id="a-cancel" type="button" data-i="x">Annuler</button>
    </div>
    <p id="a-msg"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  var cfg = window.BUDY_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY);
  var isFounder = false, repFilter = "open", sanAll = false, act = null;

  var REASONS = { harcelement: "Harcèlement", spam: "Spam", contenu_inapproprie: "Contenu inapproprié", arnaque: "Arnaque", autre: "Autre" };
  var KINDS = { warning: "Avertissement", suspension: "Suspension", ban: "Bannissement" };
  var ACTIONS = { warning: "Avertissement", suspension: "Suspension", ban: "Bannissement", report_closed: "Signalement classé",
    lifted_warning: "Avertissement retiré", lifted_suspension: "Suspension levée", lifted_ban: "Bannissement levé", message_deleted: "Message supprimé" };

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function say(t, ok) { var e = $("info"); e.textContent = t || ""; e.className = ok ? "ok" : "err"; }
  function when(d) { return new Date(d).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); }
  function whenFull(d) { return new Date(d).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }); }
  function fail(e) {
    var m = (e && e.message) || "";
    return m && m.length < 140 ? m.charAt(0).toUpperCase() + m.slice(1) : "Action impossible pour le moment.";
  }
  function empty(box, t) { box.textContent = ""; box.appendChild(el("p", "empty", t)); }

  /* ---------- Onglets ---------- */
  function tab(w) {
    ["rep", "san", "his", "mem"].forEach(function (k) {
      $("t-" + k).className = k === w ? "on" : ""; $("p-" + k).className = k === w ? "" : "hidden";
    });
    say("");
    if (w === "rep") loadReports(); else if (w === "san") loadSanctions(); else if (w === "his") loadHistory();
  }
  $("t-rep").onclick = function () { tab("rep"); };
  $("t-san").onclick = function () { tab("san"); };
  $("t-his").onclick = function () { tab("his"); };
  $("t-mem").onclick = function () { tab("mem"); };

  /* ---------- Fenêtre d'action (sanction) ---------- */
  function openAct(user, name, role, status, reportId) {
    if (role === "founder") { say("Action impossible sur le fondateur."); return; }
    if (role === "moderator" && !isFounder) { say("Seul le fondateur peut sanctionner un modérateur."); return; }
    if (status === "banned") { say("Ce membre est déjà banni."); return; }
    act = { user: user, report: reportId || null };
    $("a-title").textContent = name; $("a-sub").textContent = "Choisis la sanction puis écris la raison.";
    var sel = $("a-kind"); sel.textContent = "";
    var opts = [["warning", "Avertissement"], ["suspension:1", "Suspension 1 jour"], ["suspension:7", "Suspension 7 jours"], ["suspension:30", "Suspension 30 jours"]];
    if (isFounder) opts.push(["ban", "Bannissement (définitif)"]);
    opts.forEach(function (o) { var op = el("option", null, o[1]); op.value = o[0]; sel.appendChild(op); });
    $("a-reason").value = ""; $("a-msg").textContent = ""; $("a-ok").disabled = false;
    $("sheet").className = "";
  }
  function closeAct() { $("sheet").className = "hidden"; act = null; }
  $("a-cancel").onclick = closeAct;
  $("a-ok").onclick = function () {
    if (!act) return;
    var v = $("a-kind").value.split(":"), kind = v[0], days = v[1] ? Number(v[1]) : null;
    var reason = $("a-reason").value.trim();
    if (reason.length < 3) { $("a-msg").textContent = "Écris une raison (3 caractères minimum)."; $("a-msg").className = "err"; return; }
    if (kind === "ban" && !confirm("Bannir définitivement ce membre ?")) return;
    $("a-ok").disabled = true;
    db.rpc("sanction_member", { p_user: act.user, p_kind: kind, p_days: days, p_reason: reason, p_report: act.report }).then(function (r) {
      if (r.error) { $("a-msg").textContent = fail(r.error); $("a-msg").className = "err"; $("a-ok").disabled = false; return; }
      closeAct(); say("Sanction enregistrée.", true);
      refreshAll();
    });
  };

  /* ---------- Signalements ---------- */
  $("f-open").onclick = function () { repFilter = "open"; $("f-open").className = "btn"; $("f-closed").className = "btn sec"; loadReports(); };
  $("f-closed").onclick = function () { repFilter = "closed"; $("f-open").className = "btn sec"; $("f-closed").className = "btn"; loadReports(); };

  function loadReports() {
    db.rpc("list_reports", { p_status: repFilter }).then(function (r) {
      var box = $("reports");
      if (r.error) { empty(box, "Impossible de charger les signalements."); return; }
      var rows = r.data || [];
      if (repFilter === "open") { var b = $("b-rep"); b.textContent = rows.length ? String(rows.length) : ""; b.className = rows.length ? "dot" : ""; }
      if (!rows.length) { empty(box, repFilter === "open" ? "Aucun signalement à traiter." : "Aucun signalement classé."); return; }
      box.textContent = "";
      rows.forEach(function (x) {
        var c = el("div", "card");
        c.appendChild(el("div", "who", (x.target || "?") + "  #" + (x.target_budy || "")));
        var m = el("div", "meta");
        m.appendChild(el("span", "pill r", REASONS[x.reason] || x.reason));
        if (x.target_role === "moderator") m.appendChild(el("span", "pill g", "Modérateur"));
        if (x.target_status === "banned") m.appendChild(el("span", "pill r", "Banni"));
        m.appendChild(document.createTextNode(" par " + (x.reporter || "?") + " · " + when(x.created_at)));
        c.appendChild(m);
        if (x.message_body) c.appendChild(el("div", "quote", x.message_body));
        else c.appendChild(el("div", "meta", "Signalement du membre (sans message précis)."));
        if (x.details) c.appendChild(el("div", "meta", "Détails : " + x.details));
        if (x.status === "closed") {
          c.appendChild(el("div", "meta", "Classé par " + (x.handled_by_name || "?") + (x.note ? " · " + x.note : "")));
        } else {
          var w = el("div", "wrap");
          var s1 = el("button", "btn warn", "Sanctionner"); s1.type = "button"; s1.setAttribute("data-i", "shield");
          s1.onclick = function () { openAct(x.target_id, x.target, x.target_role, x.target_status, x.id); };
          w.appendChild(s1);
          if (x.message_body && x.message_id) {
            var s2 = el("button", "btn no", "Supprimer le message"); s2.type = "button"; s2.setAttribute("data-i", "trash");
            s2.onclick = function () {
              if (!confirm("Supprimer ce message pour tout le monde ?")) return;
              s2.disabled = true;
              db.rpc("delete_reported_message", { p_report: x.id }).then(function (z) {
                if (z.error) { say(fail(z.error)); s2.disabled = false; return; }
                say("Message supprimé.", true);
              });
            };
            w.appendChild(s2);
          }
          var s3 = el("button", "btn sec", "Classer sans sanction"); s3.type = "button"; s3.setAttribute("data-i", "check");
          s3.onclick = function () {
            s3.disabled = true;
            db.rpc("resolve_report", { p_id: x.id, p_note: "Classé sans sanction" }).then(function (z) {
              if (z.error) { say(fail(z.error)); s3.disabled = false; return; }
              say("Signalement classé.", true); loadReports();
            });
          };
          w.appendChild(s3);
          c.appendChild(w);
        }
        box.appendChild(c);
      });
    });
  }

  /* ---------- Sanctions ---------- */
  $("s-act").onclick = function () { sanAll = false; $("s-act").className = "btn"; $("s-all").className = "btn sec"; loadSanctions(); };
  $("s-all").onclick = function () { sanAll = true; $("s-act").className = "btn sec"; $("s-all").className = "btn"; loadSanctions(); };

  function loadSanctions() {
    db.rpc("list_sanctions", { p_active: !sanAll }).then(function (r) {
      var box = $("sanctions");
      if (r.error) { empty(box, "Impossible de charger les sanctions."); return; }
      var rows = r.data || [];
      if (!rows.length) { empty(box, sanAll ? "Aucune sanction." : "Aucune sanction en cours."); return; }
      box.textContent = "";
      rows.forEach(function (x) {
        var c = el("div", "card");
        c.appendChild(el("div", "who", (x.username || "?") + "  #" + (x.budy_id || "")));
        var m = el("div", "meta");
        m.appendChild(el("span", "pill " + (x.kind === "ban" ? "r" : x.kind === "suspension" ? "w" : ""), KINDS[x.kind] || x.kind));
        var line = " par " + (x.by_name || "?") + " · " + when(x.created_at);
        if (x.kind === "suspension" && x.expires_at) line += " · jusqu'au " + whenFull(x.expires_at);
        m.appendChild(document.createTextNode(line));
        c.appendChild(m);
        c.appendChild(el("div", "meta", "Raison : " + x.reason));
        if (x.lifted_at) c.appendChild(el("div", "meta", "Levée le " + whenFull(x.lifted_at)));
        else if (x.active && (x.kind !== "ban" || isFounder)) {
          var w = el("div", "wrap");
          var b = el("button", "btn sec", x.kind === "ban" ? "Lever le bannissement" : x.kind === "suspension" ? "Lever la suspension" : "Retirer l'avertissement");
          b.type = "button"; b.setAttribute("data-i", "unlock");
          b.onclick = function () {
            if (!confirm("Confirmer ?")) return;
            b.disabled = true;
            db.rpc("lift_sanction", { p_id: x.id }).then(function (z) {
              if (z.error) { say(fail(z.error)); b.disabled = false; return; }
              say("Sanction levée.", true); loadSanctions();
            });
          };
          w.appendChild(b); c.appendChild(w);
        } else if (x.active) c.appendChild(el("div", "meta", "Seul le fondateur peut lever un bannissement."));
        box.appendChild(c);
      });
    });
  }

  /* ---------- Historique ---------- */
  function loadHistory() {
    db.rpc("mod_history", { p_limit: 50 }).then(function (r) {
      var box = $("history");
      if (r.error) { empty(box, "Impossible de charger l'historique."); return; }
      var rows = r.data || [];
      if (!rows.length) { empty(box, "Aucune action pour le moment."); return; }
      box.textContent = "";
      rows.forEach(function (x) {
        var row = el("div", "row");
        row.appendChild(el("div", "who", (ACTIONS[x.action] || x.action) + (x.target ? " : " + x.target : "")));
        row.appendChild(el("div", "meta", "par " + (x.actor || "?") + " · " + when(x.created_at) + (x.details ? " · " + x.details : "")));
        box.appendChild(row);
      });
    });
  }

  /* ---------- Chercher un membre ---------- */
  $("find").onclick = function () {
    var v = ($("mid").value || "").replace(/\D/g, "");
    var box = $("found"); box.textContent = "";
    if (!v) { say("Écris un Budy ID (des chiffres)."); return; }
    say("");
    db.rpc("staff_find_member", { p_budy: Number(v) }).then(function (r) {
      if (r.error) { say(fail(r.error)); return; }
      var x = (r.data || [])[0];
      if (!x) { say("Aucun membre avec ce Budy ID."); return; }
      var c = el("div", "card");
      c.appendChild(el("div", "who", x.username + "  #" + x.budy_id));
      var m = el("div", "meta");
      m.appendChild(el("span", "pill " + (x.role === "founder" ? "g" : ""), x.role === "founder" ? "Fondateur" : x.role === "moderator" ? "Modérateur" : "Membre"));
      if (x.status === "banned") m.appendChild(el("span", "pill r", "Banni"));
      if (x.status === "pending") m.appendChild(el("span", "pill w", "En attente"));
      if (x.suspended_until) m.appendChild(el("span", "pill w", "Suspendu jusqu'au " + whenFull(x.suspended_until)));
      if (Number(x.warnings) > 0) m.appendChild(el("span", "pill w", x.warnings + " avertissement(s)"));
      c.appendChild(m);
      var w = el("div", "wrap");
      var b = el("button", "btn warn", "Sanctionner"); b.type = "button"; b.setAttribute("data-i", "shield");
      b.onclick = function () { openAct(x.id, x.username, x.role, x.status, null); };
      w.appendChild(b); c.appendChild(w);
      box.appendChild(c);
    });
  };

  function refreshAll() {
    loadReports();
    if (!$("p-san").className) loadSanctions();
    if (!$("p-his").className) loadHistory();
    if (!$("p-mem").className) $("find").onclick();
  }

  /* ---------- Démarrage ---------- */
  db.auth.getSession().then(function (s) {
    var sess = s.data && s.data.session;
    if (!sess) { $("guest").className = "card"; return; }
    db.from("profiles").select("role,status").eq("id", sess.user.id).maybeSingle().then(function (r) {
      var p = r.data || {};
      var staff = p.status === "approved" && (p.role === "founder" || p.role === "moderator");
      if (!staff) { $("nope").className = "card"; return; }
      isFounder = p.role === "founder";
      $("lead").textContent = isFounder
        ? "Tu es fondateur : tu peux avertir, suspendre, bannir et lever toutes les sanctions."
        : "Tu es modérateur : tu peux avertir et suspendre des membres. Seul le fondateur peut bannir.";
      $("app").className = "";
      loadReports();
    });
  });
})();
</script>
<script src="ui.js"></script>
</body>
  </html>
